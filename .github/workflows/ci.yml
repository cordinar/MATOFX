name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: .

# Actions are pinned to commit SHAs (not tags) per the OpenSSF Scorecard
# guidance — tags can be moved by upstream; SHAs cannot. Dependabot
# rotates these automatically; the version comment after each pin
# tracks the human-readable release.

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev]"
      - name: Ruff format check
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy

  test-sqlite:
    name: Tests (SQLite) — ${{ matrix.os }} / py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev]"
      - name: Pytest
        run: pytest -m "not postgres"

  test-postgres:
    name: Tests (Postgres) — ubuntu / py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: matofx
          POSTGRES_PASSWORD: matofx
          POSTGRES_DB: matofx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matofx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Only asyncpg (Apache-2). The previous build added psycopg2-binary
          # for sync Alembic; we now run async migrations via SQLAlchemy 2.x's
          # AsyncEngine, which lets us drop psycopg2 (LGPL-3) entirely. This
          # matters for procurement reviews that blanket-reject LGPL.
          pip install -c constraints.txt -e ".[dev,postgres]"
      - name: Pytest
        env:
          MATOFX_TEST_POSTGRES_URL: postgres://matofx:matofx@localhost:5432/matofx_test
        run: pytest

  package:
    name: Build wheel + SBOM
    runs-on: ubuntu-latest
    # Block the wheel/SBOM build until the lint and SQLite test suites
    # both pass — pre-pilot we never want to upload artefacts that
    # haven't cleared the basic gates.
    needs: [lint, test-sqlite]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build + SBOM tools
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[supply-chain]"
      - name: Build wheel + sdist
        run: |
          rm -rf dist
          python -m build --wheel --sdist
      - name: Generate CycloneDX SBOM
        # cyclonedx-py reads the installed environment (`environment` mode)
        # to capture every transitive dep with its real resolved version.
        # Schema 1.5 is the current stable; downgrade only if a customer
        # tool refuses to parse it.
        run: |
          cyclonedx-py environment \
            --output-format json \
            --schema-version 1.5 \
            --outfile dist/sbom.cdx.json
      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: matofx-package-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  verify-lockfile:
    name: Verify hashed lockfile installs cleanly
    runs-on: ubuntu-latest
    # The lockfile is regenerated out-of-band by the lockfile workflow
    # and won't exist until that PR lands. Until then this job is a
    # no-op; once committed it becomes a hard gate against drift
    # between ``pyproject.toml`` and ``requirements.lock``.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: check
        name: Check whether requirements.lock exists
        run: |
          if [ -f requirements.lock ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No requirements.lock yet — run the 'Regenerate lockfile' workflow to create one."
          fi
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install from lockfile (--require-hashes)
        if: steps.check.outputs.exists == 'true'
        run: |
          python -m pip install --upgrade pip
          # ``--require-hashes`` makes pip refuse any artefact whose
          # hash isn't in the lockfile. Combined with ``--no-deps``
          # this proves the lockfile is self-contained — no implicit
          # transitive resolution at install time.
          pip install --require-hashes --no-deps -r requirements.lock
