name: CodeQL

# Static analysis (SAST) for the Python source. Runs on every PR, on
# every push to main, and weekly so the baseline scan catches drift
# even when nothing has merged. Uses the ``security-extended`` query
# suite — broader than ``security`` and worth the extra ~2 minutes for
# a procurement-grade audit trail.
#
# Findings surface as code-scanning alerts on the repo's Security tab
# and inline on PR diffs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Sunday 04:00 UTC — after gitleaks, before Monday's Dependabot.
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

# Actions tagged ``@v<n>`` here will be auto-rotated to a commit SHA
# by the weekly Dependabot run. Verify the SHA in the resulting PR
# before merging — the OpenSSF Scorecard guideline is SHA pins only.

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python is the only language in the source tree right now;
        # leaving the matrix in place so adding (e.g.) JS for the
        # NiceGUI helpers is a one-line change.
        language: [python]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          # Restrict scanning to the source we own. Excludes the .venv
          # (vendored deps), example_tools' own venvs, and test
          # fixtures that intentionally simulate suspicious code paths.
          config: |
            paths:
              - src
            paths-ignore:
              - "**/.venv/**"
              - "**/__pycache__/**"
              - example_tools

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
