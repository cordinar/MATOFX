; MATOFX Alembic configuration.
;
; The DB URL is normally resolved at runtime by src/matofx/db/migrations/env.py
; — either from the running matofx.toml configuration, or from a -x url=... flag
; passed on the alembic command line (used by tests). The sqlalchemy.url here
; is intentionally left unset so an accidental run never targets a default DB.

[alembic]
script_location = src/matofx/db/migrations
prepend_sys_path = src
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC
sourceless = false
version_path_separator = os

; sqlalchemy.url = (resolved at runtime by env.py)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
