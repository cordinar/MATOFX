group = "laminate"
type = "number"
unit = "W/m/K"
precision = 0.01

[[outputs]]
name = "mass"
min = 0.0
label = "Laminate mass"
group = "geometry"
type = "number"
unit = "g"
precision = 0.01
kpi = true
kpi_label = "Laminate mass"
kpi_unit = "g"

[[outputs]]
name = "areal_density"
min = 0.0
label = "Areal density"
group = "geometry"
type = "number"
unit = "kg/m2"
precision = 0.001

[[outputs]]
name = "ply_stack"
label = "Ply stack"
group = "plots"
type = "file"
file_type = "html_plot"
filename = "outputs/ply_stack.html"

[[outputs]]
name = "polar_modulus"
label = "Directional modulus (polar)"
group = "plots"
type = "file"
file_type = "html_plot"
filename = "outputs/polar_modulus.html"
