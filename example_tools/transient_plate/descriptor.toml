schema_version = 1

alias = "transient_plate"
name = "Transient Plate (time-resolved field)"
version = "1.0.0"
description = """
A fast analytic heating-plate model that emits a **time-resolved temperature \
field** - a sequence of nodal snapshots on a rectangular plate as a heated \
left edge warms the plate over time. Each timestep is written as its own \
`.vtp` mesh carrying a per-node `temperature` array; the whole series is \
declared via `field_timesteps`, so the job page animates it (time slider + \
play) and a field surrogate can fit it with `time` as an extra factor. The \
heat load sets the amplitude, the conductivity sets how far the heat reaches, \
and the ambient sets the baseline. Runs in milliseconds.\
"""
main_script = "transient_plate.py"

duration_class = "snappy"

# The whole timestep series is kept automatically by the ADR-0008 retention
# floor (it expands the field_timesteps glob); nothing here needs deleting.
retain_files = []
delete_io_files = []

downstream_tools = []

[execution_backend]
kind = "subprocess"

[resources]
cpu_cores = 1
ram_mb = 512
gpu_memory_mb = 0

[[input_groups]]
name = "loading"
label = "Loading"
column = 1
row = 1

[[input_groups]]
name = "material"
label = "Material"
column = 2
row = 1

[input_column_layout]
column_1 = 0.5
column_2 = 0.5

[[inputs]]
name = "heat_load"
label = "Heat load"
group = "loading"
type = "float"
unit = "W"
default = 100
minimum = 20
maximum = 200
precision = 1
required = true

[[inputs]]
name = "ambient"
label = "Ambient temperature"
group = "loading"
type = "float"
unit = "degC"
default = 25
minimum = 0
maximum = 60
precision = 1
required = true

[[inputs]]
name = "conductivity"
label = "Thermal conductivity"
group = "material"
type = "float"
unit = "W/m/K"
default = 200
minimum = 50
maximum = 400
precision = 1
required = true

[[output_groups]]
name = "results"
label = "Results"
column = 1
row = 1

[output_column_layout]
column_1 = 1.0

[[outputs]]
name = "t_max"
label = "Peak temperature (final step)"
group = "results"
unit = "degC"
precision = 0.01
type = "number"
kpi = true
kpi_label = "Peak temperature"
kpi_unit = "degC"

[[outputs]]
name = "temperature_field"
label = "Temperature field (transient)"
group = "results"
type = "file"
file_type = "field"
filename = "outputs/temperature_0000.vtp"
field_format = "vtp"
field_node_array_name = "temperature"
field_timesteps = "outputs/temperature_*.vtp"
