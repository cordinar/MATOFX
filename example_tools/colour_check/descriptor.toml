schema_version = 1

alias = "colour_check"
name = "Colour Check"
version = "1.0.0"
description = """
Inverts the colours of an uploaded image and lists the colours that take up at least 0.1 \
% of the original image, ranked by coverage. Useful as an introductory file-in / file-out \
tool — fast to run, easy to verify the output by eye.\
"""
main_script = "colour_check.py"

duration_class = "snappy"

retain_files = []
delete_io_files = []

[execution_backend]
kind = "subprocess"

[resources]
cpu_cores = 1
ram_mb = 512
gpu_memory_mb = 0

[[input_groups]]
name = "inputs"
label = "Input Image"
column = 1
row = 1

[[inputs]]
name = "input_image"
label = "Input image"
type = "file"
group = "inputs"
required = true
help_text = "JPG, PNG, or BMP. Colours below 0.1 % of the image are dropped from the table."

[input_column_layout]
column_1 = 0.6
column_2 = 0.4

[[output_groups]]
name = "output_image"
label = "Inverted Image"
column = 1
row = 1

[[output_groups]]
name = "output_values"
label = "Original Image Colours"
column = 2
row = 1

[output_column_layout]
column_1 = 0.5
column_2 = 0.5

[[outputs]]
name = "inverted_image"
label = "Inverted image"
type = "file"
file_type = "image"
filename = "transformed_image.bmp"
group = "output_image"

[[outputs]]
name = "colours_list"
label = "Dominant colours"
type = "file"
file_type = "csv_table"
filename = "colours_list.csv"
group = "output_values"
